[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zigbee-sniffer"
version = "0.1.0"
description = "IEEE 802.15.4 / Zigbee (2.4 GHz O-QPSK) software receiver for HackRF One"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Przemysław Frasunek" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["zigbee", "802.15.4", "hackrf", "sdr", "o-qpsk", "sniffer", "wireshark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
    "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/venglin/zigbee-sniffer"
Issues = "https://github.com/venglin/zigbee-sniffer/issues"

[project.scripts]
zbdemod = "zbdemod.cli:main"
zbdemod-extcap = "zbdemod.extcap:main"

[tool.setuptools]
packages = ["zbdemod"]

[tool.setuptools.package-data]
zbdemod = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
